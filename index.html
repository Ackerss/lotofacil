    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração do Tailwind para Dark Mode via Classe -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e' },
                        emerald: { 450: '#10b981' },
                        violet: { 600: '#7c3aed', 500: '#8b5cf6' }
                    },
                    boxShadow: {
                        'neon-red': '0 0 5px rgba(239, 68, 68, 0.5), 0 0 10px rgba(239, 68, 68, 0.3)',
                        'neon-blue': '0 0 5px rgba(59, 130, 246, 0.5)',
                        'neon-purple': '0 0 5px rgba(139, 92, 246, 0.5), 0 0 10px rgba(139, 92, 246, 0.3)',
                        'neon-amber': '0 0 5px rgba(245, 158, 11, 0.6), 0 0 10px rgba(245, 158, 11, 0.4)',
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- Biblioteca para ler Excel (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .animate-pulse-once { animation: pulse 0.5s ease-in-out 1; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .glass-panel { backdrop-filter: blur(12px); transition: background-color 0.3s, border-color 0.3s; }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(203, 213, 225, 0.6); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 3px; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #10b981; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

            CheckCircle2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>,
            RefreshCw: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
        };

        const Icon = ({ name, size = 20, className }) => {
            const SvgIcon = Icons[name];
            if (!SvgIcon) return <span className="text-xs">?</span>;
            return <span className={`inline-flex items-center justify-center ${className || ''}`} style={{ width: size, height: size }}><SvgIcon /></span>;
        };

        const StatCard = ({ title, value, subtext, color = "blue" }) => {
            const colors = {
                blue: "border-blue-500 text-blue-600 dark:text-blue-400",
                emerald: "border-emerald-500 text-emerald-600 dark:text-emerald-400",
                red: "border-red-500 text-red-600 dark:text-red-400",
                purple: "border-purple-500 text-purple-600 dark:text-purple-400",
                amber: "border-amber-500 text-amber-600 dark:text-amber-400",
                cyan: "border-cyan-500 text-cyan-600 dark:text-cyan-400",
                pink: "border-pink-500 text-pink-600 dark:text-pink-400"
            };
            const subtextColors = { blue: "text-blue-500", emerald: "text-emerald-500", red: "text-red-500", purple: "text-purple-500", amber: "text-amber-500", cyan: "text-cyan-500", pink: "text-pink-500" };

            return (
                <div className={`glass-panel p-4 rounded-xl border-l-4 ${colors[color].split(' ')[0]} shadow-lg relative overflow-hidden group`}>
                    <div className="relative z-10">
                        <h3 className="text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider font-semibold">{title}</h3>
                        <div className="text-3xl font-bold mt-1 text-slate-800 dark:text-white tracking-tight">{value}</div>
                        {subtext && <div className={`text-xs mt-1 ${subtextColors[color]}`}>{subtext}</div>}
                    </div>
                    <div className={`absolute -right-4 -bottom-4 opacity-10 ${subtextColors[color]} group-hover:scale-110 transition-transform duration-300`}>
                        <Icon name="BarChart2" size={80} />
                    </div>
                </div>
            );
        };

        const Ball = ({ n, selected, onClick, size = "md", isHot, isCold, isCycleMissing, extraClass = "" }) => {
            let classes = ["flex items-center justify-center rounded-full transition-all duration-300 border"];
            
            if (onClick) classes.push("cursor-pointer hover:scale-110");
            
            if (size === 'sm') classes.push("w-6 h-6 text-xs");
            else if (size === 'lg') classes.push("w-12 h-12 text-lg");
            else classes.push("w-9 h-9 text-sm font-bold");

            if (selected) {
                classes.push("bg-gradient-to-br from-emerald-500 to-emerald-700 text-white");
                
                if (isHot) classes.push("border-red-500 shadow-neon-red ring-2 ring-red-500/50 z-10"); 
                else if (isCold) classes.push("border-blue-400 shadow-neon-blue ring-2 ring-blue-400/50 z-10"); 
                else classes.push("border-emerald-400 shadow-emerald-900/50 shadow-lg"); 
            } else {
                classes.push("bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600");
                
                if (isCycleMissing) {
                    classes.push("text-amber-600 dark:text-amber-400 font-extrabold border-amber-500 shadow-neon-amber ring-1 ring-amber-400/30 z-10");
                }
                else if (isHot) {
                    classes.push("text-red-500 font-extrabold border-red-500 shadow-neon-red ring-1 ring-red-400/30");
                } else if (isCold) {
                    classes.push("text-blue-500 font-bold border-blue-400 shadow-neon-blue ring-1 ring-blue-400/30");
                } else {
                    classes.push("text-slate-600 dark:text-gray-400 border-slate-200 dark:border-slate-600");
                }
            }

            return (
                <div onClick={() => onClick && onClick(n)} className={`${classes.join(" ")} ${extraClass}`}>
                    {n.toString().padStart(2, '0')}
                </div>
            );
        };

        const MiniBall = ({ n, isHot, isCold, isCycleMissing }) => {
             let miniClass = "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-600";
             
             if (isCycleMissing) {
                 miniClass = "bg-amber-50 dark:bg-slate-800 text-amber-500 border-amber-400 font-extrabold shadow-[0_0_5px_rgba(245,158,11,0.4)]";
             } else if (isHot) {
                 miniClass = "bg-red-50 dark:bg-slate-800 text-red-500 border-red-400 font-extrabold shadow-[0_0_5px_rgba(239,68,68,0.4)]";
             } else if (isCold) {
                 miniClass = "bg-blue-50 dark:bg-slate-800 text-blue-500 border-blue-400 font-bold";
             }

             return (
                 <span className={`w-7 h-7 flex items-center justify-center rounded-full text-xs border ${miniClass}`}>
                    {n}
                 </span>
             )
        };

        const CLOSURE_STRATEGIES = [
            { id: 1, name: "17 Dezenas: Garante 14 pontos (se acertar 15)", numbers: 17, guarantee: 14, condition: 15, estimatedGames: 8, efficiency: "Alta" },
            { id: 2, name: "18 Dezenas: Garante 14 pontos (se acertar 15)", numbers: 18, guarantee: 14, condition: 15, estimatedGames: 24, efficiency: "Média" },
            { id: 3, name: "19 Dezenas: Garante 13 pontos (se acertar 15)", numbers: 19, guarantee: 13, condition: 15, estimatedGames: 15, efficiency: "Alta" },
            { id: 4, name: "20 Dezenas: Garante 12 pontos (se acertar 15)", numbers: 20, guarantee: 12, condition: 15, estimatedGames: 9, efficiency: "Super Alta" },
            { id: 5, name: "18 Dezenas: Garante 13 pontos (se acertar 15)", numbers: 18, guarantee: 13, condition: 15, estimatedGames: 6, efficiency: "Super Alta" },
        ];

        const getCombinations = (arr, k) => {
            const result = [];
            function backtrack(start, combo) {
                if (combo.length === k) { result.push([...combo]); return; }
                for (let i = start; i < arr.length; i++) {
                    combo.push(arr[i]); backtrack(i + 1, combo); combo.pop();
                }
            }
            backtrack(0, []);
            return result;
        };

        const generateOptimizedClosure = (selectedNumbers, strategy) => {
            const K = 15;
            const { guarantee, condition } = strategy;
            const scenarios = getCombinations(selectedNumbers, condition);
            const potentialGames = getCombinations(selectedNumbers, K);
            const finalGames = [];
            let uncoveredScenarios = [...scenarios];

            while (uncoveredScenarios.length > 0) {
                let bestGame = null;
                let bestCoveredCount = -1;
                let bestCoveredIndices = [];

                for (let i = 0; i < potentialGames.length; i++) {
                    const game = potentialGames[i];
                    let currentCoveredIndices = [];
                    for (let j = 0; j < uncoveredScenarios.length; j++) {
                        const scenario = uncoveredScenarios[j];
                        let matchCount = 0;
                        let p1 = 0, p2 = 0;
                        while(p1 < game.length && p2 < scenario.length) {
                            if (game[p1] === scenario[p2]) { matchCount++; p1++; p2++; }
                            else if (game[p1] < scenario[p2]) { p1++; }
                            else { p2++; }
                        }
                        if (matchCount >= guarantee) currentCoveredIndices.push(j);
                    }

                    if (currentCoveredIndices.length > bestCoveredCount) {
                        bestCoveredCount = currentCoveredIndices.length;
                        bestGame = game;
                        bestCoveredIndices = currentCoveredIndices;
                    }
                }

                if (bestGame) {
                    finalGames.push(bestGame);
                    const newUncovered = [];
                    const coveredSet = new Set(bestCoveredIndices);
                    for(let k=0; k<uncoveredScenarios.length; k++){
                        if(!coveredSet.has(k)) newUncovered.push(uncoveredScenarios[k]);
                    }
                    uncoveredScenarios = newUncovered;
                    const gameIdx = potentialGames.indexOf(bestGame);
                    if(gameIdx > -1) potentialGames.splice(gameIdx, 1);
                } else { break; }
            }
            return finalGames;
        };

        function App() {
            const [theme, setTheme] = useState(() => { try { return localStorage.getItem('loto_theme') || 'dark'; } catch(e) { return 'dark'; } });
            const toggleTheme = () => { const newTheme = theme === 'dark' ? 'light' : 'dark'; setTheme(newTheme); localStorage.setItem('loto_theme', newTheme); };
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [fullHistory, setFullHistory] = useState(() => {
                try { const saved = localStorage.getItem('loto_full_history_v2'); return saved ? JSON.parse(saved) : []; } catch(e) { return []; }
            });
            const [scopeSize, setScopeSize] = useState('all'); 
            const activeHistory = useMemo(() => {
                if (scopeSize === 'all') return fullHistory;
                return fullHistory.slice(0, parseInt(scopeSize));
            }, [fullHistory, scopeSize]);

            const [isFileLoaded, setIsFileLoaded] = useState(fullHistory.length > 0);
            const [error, setError] = useState(null);
            
            const [genFilters, setGenFilters] = useState({ oddTarget: 8, sumMin: 180, sumMax: 220, repeatsTarget: 9, fixedNumbers: [], excludeNumbers: [] });
            const [generatedGames, setGeneratedGames] = useState([]);
            const [savedGames, setSavedGames] = useState(() => { try { const saved = localStorage.getItem('loto_saved_games'); return saved ? JSON.parse(saved) : []; } catch (e) { return []; } });
            const [manualSelection, setManualSelection] = useState([]);
            const [closureStrategy, setClosureStrategy] = useState(CLOSURE_STRATEGIES[0]);
            const [closureSelection, setClosureSelection] = useState([]);
            const [closureResult, setClosureResult] = useState(null);
            const [isGeneratingClosure, setIsGeneratingClosure] = useState(false);
            const [closureSimStats, setClosureSimStats] = useState(null);
            const [isSearchingProfit, setIsSearchingProfit] = useState(false); 

            const fileInputRef = useRef(null);

            useEffect(() => {
                if (fullHistory.length > 0) { try { localStorage.setItem('loto_full_history_v2', JSON.stringify(fullHistory)); } catch(e) {} }
            }, [fullHistory]);
            useEffect(() => { localStorage.setItem('loto_saved_games', JSON.stringify(savedGames)); }, [savedGames]);

            const cycleData = useMemo(() => {
                if (!fullHistory || fullHistory.length === 0) return null;
                
                let currentOpenCycleDraws = [];
                let tempSet = new Set();
                
                for (let i = 0; i < fullHistory.length; i++) {
                    let draw = fullHistory[i];
                    let newNums = 0;
                    draw.Dezenas.forEach(n => { if (!tempSet.has(n)) newNums++; });

                    if (tempSet.size + newNums === 25) {
                        currentOpenCycleDraws = fullHistory.slice(0, i);
                        break;
                    } else {
                        draw.Dezenas.forEach(n => tempSet.add(n));
                    }
                }

                let drawnInOpenCycle = new Set();
                currentOpenCycleDraws.forEach(d => d.Dezenas.forEach(n => drawnInOpenCycle.add(n)));
                
                let missing = [];
                for (let n = 1; n <= 25; n++) {
                    if (!drawnInOpenCycle.has(n)) missing.push(n);
                }

                return {
                    drawsCount: currentOpenCycleDraws.length,
                    missingNumbers: missing,
                    missingSet: new Set(missing)
                };
            }, [fullHistory]);

            // --- O NOVO PARSER "TRATOR" ---
            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const processData = (parsed) => {
                    // Remover duplicados pelo Concurso para evitar dor de cabeça
                    const uniqueParsedMap = new Map();
                    parsed.forEach(p => {
                        if (!uniqueParsedMap.has(p.Concurso)) uniqueParsedMap.set(p.Concurso, p);
                    });
                    const uniqueParsed = Array.from(uniqueParsedMap.values());

                    if (uniqueParsed.length > 0) {
                        uniqueParsed.sort((a, b) => b.Concurso - a.Concurso);
                        setFullHistory(uniqueParsed);
                        setIsFileLoaded(true);
                        setError(null);
                        setActiveTab('dashboard');
                    } else {
                        setError("O arquivo não parece conter resultados válidos da Lotofácil (ou a formatação está diferente do esperado).");
                    }
                    
                    // Reseta o input para permitir clicar e enviar o mesmo arquivo de novo se precisar
                    if (fileInputRef.current) fileInputRef.current.value = '';
                };

                // Função super-flexível que analisa linha a linha
                const extractValidRow = (rowArray) => {
                    if (!rowArray || rowArray.length < 15) return null;
                    
                    // Pega a primeira coluna e força a ser número (limpa pontos se tiver "1.050")
                    let rawConcurso = String(rowArray[0]).trim().replace(/\./g, '');
                    if (!/^\d+$/.test(rawConcurso)) return null; 
                    let concurso = parseInt(rawConcurso, 10);
                    // Ignora números que claramente não são concursos reais ainda
                    if (isNaN(concurso) || concurso <= 0 || concurso > 20000) return null;

                    // Helper para verificar se um texto puro é EXATAMENTE uma dezena da lotofácil (evita R$ 15,00 etc)
                    const isValidBall = (val) => {
                        let s = String(val).trim();
                        // Tem que ter exatamente 1 ou 2 dígitos puros (sem letras, sem vírgulas)
                        if (/^\d{1,2}$/.test(s)) {
                            let n = parseInt(s, 10);
                            return (n >= 1 && n <= 25) ? n : null;
                        }
                        return null;
                    };

                    // TENTATIVA 1: O Padrão Rígido da Caixa (as dezenas ficam exatamente da coluna 2 à 16)
                    let strictCaixa = rowArray.slice(2, 17).map(isValidBall).filter(n => n !== null);
                    if ([...new Set(strictCaixa)].length === 15) {
                        return { Concurso: concurso, Data: String(rowArray[1] || '').trim(), Dezenas: [...new Set(strictCaixa)].sort((a,b)=>a-b) };
                    }

                    // TENTATIVA 2: Busca "Solta" (Trator). Procura as 15 primeiras dezenas na linha ignorando o que for inútil.
                    let looseDezenas = [];
                    let data = '';
                    for (let i = 1; i < rowArray.length; i++) {
                        let val = String(rowArray[i]).trim();
                        if (val.match(/^\d{2}\/\d{2}\/\d{4}$/) && !data) data = val;
                        
                        let num = isValidBall(val);
                        if (num !== null && !looseDezenas.includes(num)) {
                            looseDezenas.push(num);
                        }
                        if (looseDezenas.length === 15) break;
                    }

                    if (looseDezenas.length === 15) {
                        return { Concurso: concurso, Data: data || String(rowArray[1] || '').trim(), Dezenas: looseDezenas.sort((a,b)=>a-b) };
                    }
                    
                    return null; // A linha não continha 15 números válidos
                };

                const reader = new FileReader();
                reader.onload = (e) => {
                    const buffer = e.target.result;
                    let parsedList = [];
                    
                    // 1. Tenta usar a biblioteca de XLSX padrão
                    try {
                        const workbook = XLSX.read(buffer, {type: 'array'});
                        let sheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('LOTOFÁCIL')) || workbook.SheetNames[0];
                        const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });

                        for (let row of rawData) {
                            if (Array.isArray(row)) {
                                let extracted = extractValidRow(row);
                                if (extracted) parsedList.push(extracted);
                            }
                        }
                    } catch (err) { console.warn("Erro ao ler como XLSX puro:", err); }

                    // 2. Se a lib XLSX não achou nada (ou a Caixa disfarçou o arquivo), usamos texto força-bruta
                    if (parsedList.length === 0) {
                        try {
                            const decoder = new TextDecoder("windows-1252");
                            const textString = decoder.decode(buffer);
                            
                            let rows = [];
                            if (textString.includes('<tr') || textString.includes('<TR')) {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = textString;
                                const trs = tempDiv.querySelectorAll('tr');
                                trs.forEach(tr => {
                                    let cells = Array.from(tr.querySelectorAll('td, th')).map(td => td.textContent.trim());
                                    rows.push(cells);
                                });
                            } else {
                                rows = textString.split('\n').map(line => line.split(/[;,|\t]/).map(s => s.trim()));
                            }

                            for (let row of rows) {
                                let extracted = extractValidRow(row);
                                if (extracted) parsedList.push(extracted);
                            }
                        } catch(err2) {
                            console.error("Erro no fallback de texto/HTML:", err2);
                        }
                    }

                    processData(parsedList);
                };
                reader.readAsArrayBuffer(file);
            };

            const resetData = () => {
                if(confirm("Deseja apagar todo o histórico e começar do zero?")){
                    setFullHistory([]);
                    setIsFileLoaded(false);
                    localStorage.removeItem('loto_full_history_v2');
                    window.location.reload();
                }
            };

            const stats = useMemo(() => {
                if (!activeHistory.length) return null;

                const freqs = Array(25).fill(0);
                let totalSum = 0; let totalOdds = 0;
                
                activeHistory.forEach(draw => {
                    let drawSum = 0; let drawOdds = 0;
                    draw.Dezenas.forEach(n => {
                        if (n >= 1 && n <= 25) freqs[n-1]++;
                        if (n % 2 !== 0) drawOdds++;
                        drawSum += n;
                    });
                    totalSum += drawSum; totalOdds += drawOdds;
                });

                const totalDraws = activeHistory.length;
                const freqDetails = freqs.map((count, i) => ({ n: i + 1, count, percent: ((count / totalDraws) * 100).toFixed(1) }));
                const sortedFreq = [...freqDetails].sort((a, b) => b.count - a.count);

                const topCount = 8;
                const hotNumbersList = sortedFreq.slice(0, topCount);
                const coldNumbersList = sortedFreq.slice(-topCount).reverse(); 
                
                return {
                    totalDraws, lastDraw: fullHistory[0], avgSum: Math.round(totalSum / totalDraws), avgOdds: Math.round(totalOdds / totalDraws),
                    hotNumbersList, coldNumbersList, hotSet: new Set(hotNumbersList.map(i => i.n)), coldSet: new Set(coldNumbersList.map(i => i.n)),
                    frequencies: freqDetails, sortedFrequencies: sortedFreq
                };
            }, [activeHistory, fullHistory]);

            const generateGame = () => {
                const { oddTarget, sumMin, sumMax, repeatsTarget } = genFilters;
                const lastDrawSet = new Set(fullHistory[0]?.Dezenas || []);
                let attempts = 0; const maxAttempts = 10000; 
                
                while (attempts < maxAttempts) {
                    attempts++;
                    const candidate = Array.from({length: 25}, (_, i) => i + 1).sort(() => 0.5 - Math.random()).slice(0, 15).sort((a,b) => a-b);
                    const sum = candidate.reduce((a, b) => a + b, 0);
                    if (sum < sumMin || sum > sumMax) continue;

                    const odds = candidate.filter(n => n % 2 !== 0).length;
                    if (Math.abs(odds - oddTarget) > 1 && oddTarget !== 0) continue; 

                    if (lastDrawSet.size > 0) {
                        const repeats = candidate.filter(n => lastDrawSet.has(n)).length;
                        if (Math.abs(repeats - repeatsTarget) > 1 && repeatsTarget !== 0) continue;
                    }

                    setGeneratedGames(prev => [{ id: Date.now(), numbers: candidate, meta: { sum, odds, repeats: candidate.filter(n => lastDrawSet.has(n)).length } }, ...prev].slice(0, 50)); 
                    return;
                }
                alert("Não foi possível gerar com estes filtros restritos. Tente abrir mais as margens.");
            };

            const checkPerformance = (numbers) => {
                if (!activeHistory.length) return { maxHits: 0, hitsDistribution: {} };
                let maxHits = 0; const hitsDist = { 11:0, 12:0, 13:0, 14:0, 15:0 };
                activeHistory.forEach(draw => {
                    const hits = numbers.filter(n => draw.Dezenas.includes(n)).length;
                    if (hits > maxHits) maxHits = hits;
                    if (hits >= 11) hitsDist[hits]++;
                });
                return { maxHits, hitsDist };
            };

            const toggleManualNumber = (n) => {
                if (manualSelection.includes(n)) setManualSelection(manualSelection.filter(x => x !== n));
                else {
                    if (manualSelection.length >= 20) return alert("Máximo de 20 números para análise.");
                    setManualSelection([...manualSelection, n].sort((a,b) => a-b));
                }
            };

            const toggleClosureNumber = (n) => {
                if (closureSelection.includes(n)) setClosureSelection(closureSelection.filter(x => x !== n));
                else {
                    if (closureSelection.length >= closureStrategy.numbers) return alert(`Limite de ${closureStrategy.numbers} números atingido para este fechamento.`);
                    setClosureSelection([...closureSelection, n].sort((a,b) => a-b));
                }
            };

            const addMissingCycleToSelection = (setterFunction, currentSelection, limit) => {
                if (!cycleData || cycleData.missingNumbers.length === 0) {
                    return alert("O ciclo atual acabou de fechar! Nenhuma dezena pendente.");
                }
                let newSelection = [...currentSelection];
                let added = 0;
                cycleData.missingNumbers.forEach(n => {
                    if (!newSelection.includes(n) && newSelection.length < limit) {
                        newSelection.push(n);
                        added++;
                    }
                });
                setterFunction(newSelection.sort((a,b) => a-b));
                if (added === 0 && newSelection.length >= limit) alert("Sua cartela já está cheia!");
            };

            const handleAutoFindProfit = async () => {
                if (!activeHistory || activeHistory.length === 0) return alert("Carregue dados primeiro.");
                setIsSearchingProfit(true); setClosureResult(null); setClosureSimStats(null);
                await new Promise(resolve => setTimeout(resolve, 50));

                const maxAttempts = 300; let foundCombination = null;
                const gamePrice = 3.0; const prizeValues = { 11: 6, 12: 12, 13: 30, 14: 1500, 15: 1500000 };
                
                for (let i = 0; i < maxAttempts; i++) {
                    const candidate = Array.from({length: 25}, (_, i) => i + 1).sort(() => 0.5 - Math.random()).slice(0, closureStrategy.numbers).sort((a,b) => a-b);
                    const games = generateOptimizedClosure(candidate, closureStrategy);
                    let totalCost = games.length * gamePrice * activeHistory.length; 
                    let totalPrizes = 0;

                    for (let d = 0; d < activeHistory.length; d++) {
                        for (let g = 0; g < games.length; g++) {
                            const hits = games[g].filter(n => activeHistory[d].Dezenas.includes(n)).length;
                            if (hits >= 11) totalPrizes += prizeValues[hits];
                        }
                    }

                    if (totalPrizes - totalCost > 0) { foundCombination = candidate; break; }
                    if (i % 20 === 0) await new Promise(r => setTimeout(r, 0));
                }

                if (foundCombination) {
                    setClosureSelection(foundCombination);
                    executeClosureGeneration(foundCombination);
                } else {
                    alert(`Não encontrei lucro positivo em ${maxAttempts} tentativas. Tente diminuir o Filtro Analisar.`);
                    setIsSearchingProfit(false);
                }
            };

            const executeClosureGeneration = (selectionToUse) => {
                const selection = selectionToUse || closureSelection;
                if (selection.length !== closureStrategy.numbers) return alert(`Selecione exatamente ${closureStrategy.numbers} números.`);
                
                setIsGeneratingClosure(true);
                setTimeout(() => {
                    const games = generateOptimizedClosure(selection, closureStrategy);
                    let totalCost = 0; let totalPrizes = 0;
                    let prizesBreakdown = { 11:0, 12:0, 13:0, 14:0, 15:0 };
                    const prizeValues = { 11: 6, 12: 12, 13: 30, 14: 1500, 15: 1500000 };

                    activeHistory.forEach(draw => {
                        totalCost += (games.length * 3.0);
                        games.forEach(game => {
                            const hits = game.filter(n => draw.Dezenas.includes(n)).length;
                            if (hits >= 11) { prizesBreakdown[hits]++; totalPrizes += prizeValues[hits]; }
                        });
                    });

                    setClosureSimStats({
                        totalCost, totalPrizes, profit: totalPrizes - totalCost,
                        prizesBreakdown, roi: totalCost > 0 ? ((totalPrizes - totalCost) / totalCost) * 100 : 0
                    });

                    setClosureResult(games); setIsGeneratingClosure(false); setIsSearchingProfit(false);
                }, 100);
            };

            const saveClosureGames = () => {
                if (!closureResult) return;
                const newGames = closureResult.map(nums => ({
                    id: Date.now() + Math.random(), numbers: nums,
                    meta: { sum: nums.reduce((a,b)=>a+b,0), odds: nums.filter(n=>n%2!==0).length, repeats: 0, tag: "Fechamento" }
                }));
                setSavedGames([...savedGames, ...newGames]);
                alert(`${newGames.length} jogos salvos com sucesso!`);
            };

            const manualAnalysis = useMemo(() => {
                if (manualSelection.length < 15) return null;
                const hitsFull = { 11:0, 12:0, 13:0, 14:0, 15:0 };
                let totalHitsSum = 0;

                activeHistory.forEach(draw => {
                    const hits = manualSelection.filter(n => draw.Dezenas.includes(n)).length;
                    if (hits >= 11 && hits <= 15) hitsFull[hits]++;
                    totalHitsSum += hits;
                });

                const individualStats = manualSelection.map(n => {
                    const count = activeHistory.filter(d => d.Dezenas.includes(n)).length;
                    return { n, count, percent: ((count / activeHistory.length)*100).toFixed(0) };
                });

                const awardsLog = activeHistory.map(draw => {
                    return { ...draw, hits: manualSelection.filter(n => draw.Dezenas.includes(n)).length };
                }).filter(d => d.hits >= 11).sort((a,b) => b.Concurso - a.Concurso);

                return { hitsFull, avgHits: (totalHitsSum / activeHistory.length).toFixed(2), individualStats, awardsLog };
            }, [manualSelection, activeHistory]); 

            if (!isFileLoaded) {
                return (
                    <div className={theme}>
                        <div className="min-h-screen bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-white flex flex-col items-center justify-center p-4 transition-colors duration-300">
                            <div className="max-w-md w-full glass-panel p-8 rounded-2xl text-center">
                                <div className="bg-emerald-500/20 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-500/50 shadow-[0_0_30px_rgba(16,185,129,0.2)]">
                                    <Icon name="Upload" size={40} className="text-emerald-500" />
                                </div>
                                <h1 className="text-3xl font-bold mb-2 bg-gradient-to-r from-emerald-500 to-teal-400 bg-clip-text text-transparent">LotoAnalítica Pro</h1>
                                <p className="text-slate-500 dark:text-gray-400 mb-8 text-sm leading-relaxed">
                                    Importe sua planilha da Lotofácil da Caixa para desbloquear inteligência estatística avançada.
                                </p>
                                <input type="file" accept=".csv,.xlsx,.xls,.htm,.html" onChange={handleFileUpload} ref={fileInputRef} className="hidden" />
                                <button onClick={() => fileInputRef.current.click()} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30 group">
                                    <Icon name="FileSpreadsheet" className="group-hover:scale-110 transition-transform" /> Carregar Planilha
                                </button>
                                {error && (
                                    <div className="mt-4 bg-red-100 dark:bg-red-900/30 border border-red-500/50 p-3 rounded text-sm text-red-600 dark:text-red-200 flex flex-col items-center gap-2 justify-center animate-pulse-once">
                                        <div className="flex items-center gap-2 font-bold"><Icon name="AlertTriangle" size={16} /> Erro de Leitura</div>
                                        <p className="text-xs">{error}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={theme}>
                    <div className="min-h-screen pb-20 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">
                        <div className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm dark:shadow-xl transition-colors">
                            <div className="max-w-7xl mx-auto px-4 py-3">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-gradient-to-br from-emerald-500 to-teal-600 p-2 rounded-lg shadow-lg">
                                                <Icon name="Dice5" className="text-white" size={24} />
                                            </div>
                                            <div>
                                                <h1 className="font-bold text-xl text-slate-800 dark:text-white tracking-tight">LotoAnalítica <span className="text-emerald-500 font-light">Pro</span></h1>
                                                <p className="text-[10px] text-slate-400 dark:text-gray-400 uppercase tracking-widest">Sistema Offline Inteligente</p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-3">
                                        <button onClick={toggleTheme} className="p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
                                            {theme === 'dark' ? <Icon name="Sun" size={18} /> : <Icon name="Moon" size={18} />}
                                        </button>
                                        <div className="flex items-center gap-3 bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                                            <div className="px-2 flex items-center gap-2 text-xs text-slate-500 dark:text-gray-400 uppercase font-bold tracking-wider">
                                                <Icon name="Filter" size={14} />
                                                <span className="hidden sm:inline">Analisar:</span>
                                            </div>
                                            <div className="flex bg-slate-100 dark:bg-slate-900 rounded-md p-1 gap-1">
                                                {[{id: '10', label: '10'},{id: '50', label: '50'},{id: '100', label: '100'},{id: 'all', label: 'TODOS'}].map(opt => (
                                                    <button key={opt.id} onClick={() => setScopeSize(opt.id)}
                                                        className={`px-3 py-1 rounded text-xs font-bold transition-all ${scopeSize === opt.id ? 'bg-emerald-500 text-white shadow' : 'text-slate-500 dark:text-gray-500 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
                                                        {opt.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex justify-center border-t border-slate-200 dark:border-slate-800 mt-2 bg-white/50 dark:bg-slate-900/50 overflow-x-auto">
                                {[ { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' }, { id: 'closure', label: 'Fechamentos Inteligentes', icon: 'Grid' }, { id: 'manual', label: 'Analisador Manual', icon: 'Edit3' }, { id: 'generator', label: 'Gerador IA', icon: 'Cpu' }, { id: 'saved', label: 'Jogos Salvos', icon: 'Save' } ].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-all whitespace-nowrap ${activeTab === tab.id ? 'border-emerald-500 text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/5' : 'border-transparent text-slate-500 dark:text-gray-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                        <Icon name={tab.icon} size={16} /> <span className="hidden sm:inline">{tab.label}</span>
                                    </button>
                                ))}
                                <button onClick={resetData} className="px-4 py-3 text-red-400/50 hover:text-red-500 ml-4 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-t transition-colors" title="Carregar Novo Arquivo">
                                    <Icon name="XCircle" size={18} />
                                </button>
                            </div>
                        </div>

                        <main className="max-w-7xl mx-auto px-4 py-8">
                            
                            {activeTab === 'dashboard' && stats && (
                                <div className="space-y-8 animate-pulse-once">
                                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                        <h2 className="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                            <Icon name="BarChart2" className="text-emerald-500" /> 
                                            Visão Geral <span className="text-sm font-normal text-slate-500 dark:text-gray-500 ml-2">(Últimos {stats.totalDraws} concursos)</span>
                                        </h2>
                                        
                                        {/* NOVO: CARD DO CICLO NO DASHBOARD */}
                                        {cycleData && (
                                            <div className="bg-amber-100 dark:bg-amber-900/30 border border-amber-500/50 rounded-lg p-3 flex items-center gap-4 shadow-neon-amber">
                                                <div className="flex items-center gap-2 text-amber-600 dark:text-amber-400 font-bold">
                                                    <Icon name="RefreshCw" size={20} />
                                                    <div>
                                                        <div className="text-sm">Ciclo Aberto</div>
                                                        <div className="text-[10px] font-normal opacity-80">{cycleData.drawsCount} concursos até agora</div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="glass-panel p-6 rounded-xl h-fit">
                                        <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-6 flex items-center gap-2"><Icon name="Sliders" className="text-emerald-500" /> Configuração IA</h2>
                                        <button onClick={generateGame} className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:brightness-110 text-white font-bold rounded-lg shadow-lg flex items-center justify-center gap-2 transition-all">
                                            <Icon name="Wand2" size={18} /> Gerar Palpites
                                        </button>
                                    </div>
                                    <div className="md:col-span-2 space-y-4">
                                        <div className="space-y-3">
                                            {generatedGames.map((game, i) => {
                                                const perf = checkPerformance(game.numbers);
                                                return (
                                                    <div key={game.id} className="glass-panel p-4 rounded-xl border-l-4 border-emerald-500 flex flex-col md:flex-row gap-4 justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors">
                                                        <div className="flex-1">
                                                            <div className="flex gap-1 mb-2">
                                                                {game.numbers.map(n => <MiniBall key={n} n={n} isHot={stats.hotSet.has(n)} isCold={stats.coldSet.has(n)} isCycleMissing={cycleData?.missingSet?.has(n)} />)}
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-4 border-l border-slate-200 dark:border-slate-700 pl-4">
                                                            <button onClick={() => setSavedGames([...savedGames, game])} className="p-2 bg-emerald-100 hover:bg-emerald-500 text-emerald-600 hover:text-white rounded-lg transition-colors"><Icon name="BookmarkPlus" /></button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'saved' && (
                                <div>
                                    <h2 className="text-xl font-bold text-slate-800 dark:text-white mb-6">Jogos Salvos ({savedGames.length})</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {savedGames.map((game, i) => (
                                            <div key={i} className="glass-panel p-4 rounded-xl relative group">
                                                <button onClick={() => setSavedGames(savedGames.filter(g => g.id !== game.id))} className="absolute top-2 right-2 text-red-400 opacity-0 group-hover:opacity-100 p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded transition-all"><Icon name="Trash2" size={16} /></button>
                                                <div className="flex flex-wrap gap-1 mt-4">
                                                    {game.numbers.map(n => <MiniBall key={n} n={n} isHot={stats.hotSet.has(n)} isCold={stats.coldSet.has(n)} isCycleMissing={cycleData?.missingSet?.has(n)} />)}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
