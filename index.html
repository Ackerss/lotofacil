<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LotoAnalítica Pro - Sistema Completo (Com Auto-Lucro)</title>
    <!-- Bibliotecas Essenciais (React e Tailwind) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração do Tailwind para Dark Mode via Classe -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151e2e',
                        },
                        emerald: {
                            450: '#10b981', // Ajuste fino
                        },
                        violet: {
                            600: '#7c3aed',
                            500: '#8b5cf6',
                        }
                    },
                    boxShadow: {
                        'neon-red': '0 0 5px rgba(239, 68, 68, 0.5), 0 0 10px rgba(239, 68, 68, 0.3)',
                        'neon-blue': '0 0 5px rgba(59, 130, 246, 0.5)',
                        'neon-purple': '0 0 5px rgba(139, 92, 246, 0.5), 0 0 10px rgba(139, 92, 246, 0.3)',
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- Biblioteca para ler Excel (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
        }
        .animate-pulse-once { animation: pulse 0.5s ease-in-out 1; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Glass Panel Adaptável (Claro/Escuro) */
        .glass-panel {
            backdrop-filter: blur(12px);
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        /* Dark Mode Glass */
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Light Mode Glass */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        /* Custom Scrollbar for Table */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }

        /* Animação de Loading para Fechamento */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            Database: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,

            Sliders: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/></svg>,
            Wand2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>,

            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,

            FileSpreadsheet: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>,
            XCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>,
            Edit3: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>,
            Filter: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,

            Flame: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.6-3.3.7 3.7 3.1 5.8 2.9 8.8z"/></svg>,
            Snowflake: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg>,

            Wallet: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5"/><path d="M16 12h5"/><path d="M2 7h20"/><circle cx="18" cy="16" r="1"/></svg>,
            CheckCircle2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
        };

        const Icon = ({ name, size = 20, className }) => {
            const SvgIcon = Icons[name];
            if (!SvgIcon) return <span className="text-xs">?</span>;
            return (
                <span className={`inline-flex items-center justify-center ${className || ''}`} style={{ width: size, height: size }}>
                    <SvgIcon />
                </span>
            );
        };

        const StatCard = ({ title, value, subtext, color = "blue" }) => {
            const colors = {
                blue: "border-blue-500 text-blue-600 dark:text-blue-400",
                emerald: "border-emerald-500 text-emerald-600 dark:text-emerald-400",
                red: "border-red-500 text-red-600 dark:text-red-400",
                purple: "border-purple-500 text-purple-600 dark:text-purple-400",
                amber: "border-amber-500 text-amber-600 dark:text-amber-400",
                cyan: "border-cyan-500 text-cyan-600 dark:text-cyan-400",
                pink: "border-pink-500 text-pink-600 dark:text-pink-400"
            };

            const subtextColors = {
                blue: "text-blue-500",
                emerald: "text-emerald-500",
                red: "text-red-500",
                purple: "text-purple-500",
                amber: "text-amber-500",
                cyan: "text-cyan-500",
                pink: "text-pink-500"
            };

            return (
                <div className={`glass-panel p-4 rounded-xl border-l-4 ${colors[color].split(' ')[0]} shadow-lg relative overflow-hidden group`}>
                    <div className="relative z-10">
                        <h3 className="text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider font-semibold">{title}</h3>
                        <div className="text-3xl font-bold mt-1 text-slate-800 dark:text-white tracking-tight">{value}</div>
                        {subtext && <div className={`text-xs mt-1 ${subtextColors[color]}`}>{subtext}</div>}
                    </div>
                    {/* Background decoration */}
                    <div className={`absolute -right-4 -bottom-4 opacity-10 ${subtextColors[color]} group-hover:scale-110 transition-transform duration-300`}>
                        <Icon name="BarChart2" size={80} />
                    </div>
                </div>
            );
        };

        // --- ATUALIZADO: COMPONENTE BALL COM AURA PERSISTENTE ---
        const Ball = ({ n, selected, onClick, size = "md", isHot, isCold, extraClass = "" }) => {
            
            let classes = ["flex items-center justify-center rounded-full transition-all duration-300 border"];
            
            // Interatividade
            if (onClick) classes.push("cursor-pointer hover:scale-110");
            
            // Tamanho
            if (size === 'sm') classes.push("w-6 h-6 text-xs");
            else if (size === 'lg') classes.push("w-12 h-12 text-lg");
            else classes.push("w-9 h-9 text-sm font-bold");

            // Lógica de Cores e Aura
            if (selected) {
                // SELECIONADO: Fundo Verde
                classes.push("bg-gradient-to-br from-emerald-500 to-emerald-700 text-white");
                
                // AURA PERSISTENTE: Se for Hot ou Cold, a borda e o glow mudam de cor
                // mesmo estando selecionado.
                if (isHot) {
                    // Selecionado + Hot = Fundo Verde, Borda/Glow Vermelho
                    classes.push("border-red-500 shadow-neon-red ring-2 ring-red-500/50 z-10"); 
                } else if (isCold) {
                    // Selecionado + Cold = Fundo Verde, Borda/Glow Azul
                    classes.push("border-blue-400 shadow-neon-blue ring-2 ring-blue-400/50 z-10"); 
                } else {
                    // Selecionado + Neutro = Fundo Verde, Borda Verde
                    classes.push("border-emerald-400 shadow-emerald-900/50 shadow-lg"); 
                }
            } else {
                // NÃO SELECIONADO
                classes.push("bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600");
                
                if (isHot) {
                    classes.push("text-red-500 font-extrabold border-red-500 shadow-neon-red ring-1 ring-red-400/30");
                } else if (isCold) {
                    classes.push("text-blue-500 font-bold border-blue-400 shadow-neon-blue ring-1 ring-blue-400/30");
                } else {
                    classes.push("text-slate-600 dark:text-gray-400 border-slate-200 dark:border-slate-600");
                }
            }

            return (
                <div 
                    onClick={() => onClick && onClick(n)}
                    className={`${classes.join(" ")} ${extraClass}`}
                >
                    {n.toString().padStart(2, '0')}
                </div>
            );
        };

        // Helper para renderizar mini bolas (listas) com a mesma lógica visual
        const MiniBall = ({ n, isHot, isCold }) => {
             let miniClass = "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-600";
             
             if (isHot) {
                 miniClass = "bg-red-50 dark:bg-slate-800 text-red-500 border-red-400 font-extrabold shadow-[0_0_5px_rgba(239,68,68,0.4)]";
             } else if (isCold) {
                 miniClass = "bg-blue-50 dark:bg-slate-800 text-blue-500 border-blue-400 font-bold";
             }

             return (
                 <span className={`w-7 h-7 flex items-center justify-center rounded-full text-xs border ${miniClass}`}>
                    {n}
                 </span>
             )
        };


        // --- CLOSURE (FECHAMENTOS) LOGIC ---
        const CLOSURE_STRATEGIES = [
            { id: 1, name: "17 Dezenas: Garante 14 pontos (se acertar 15)", numbers: 17, guarantee: 14, condition: 15, estimatedGames: 8, efficiency: "Alta" },
            { id: 2, name: "18 Dezenas: Garante 14 pontos (se acertar 15)", numbers: 18, guarantee: 14, condition: 15, estimatedGames: 24, efficiency: "Média" },
            { id: 3, name: "19 Dezenas: Garante 13 pontos (se acertar 15)", numbers: 19, guarantee: 13, condition: 15, estimatedGames: 15, efficiency: "Alta" },
            { id: 4, name: "20 Dezenas: Garante 12 pontos (se acertar 15)", numbers: 20, guarantee: 12, condition: 15, estimatedGames: 9, efficiency: "Super Alta" },
            { id: 5, name: "18 Dezenas: Garante 13 pontos (se acertar 15)", numbers: 18, guarantee: 13, condition: 15, estimatedGames: 6, efficiency: "Super Alta" },
        ];

        // Helper: Generate Combinations
        const getCombinations = (arr, k) => {
            const result = [];
            function backtrack(start, combo) {
                if (combo.length === k) {
                    result.push([...combo]);
                    return;
                }
                for (let i = start; i < arr.length; i++) {
                    combo.push(arr[i]);
                    backtrack(i + 1, combo);
                    combo.pop();
                }
            }
            backtrack(0, []);
            return result;
        };

        // Helper: Greedy Covering Algorithm for Closures
        const generateOptimizedClosure = (selectedNumbers, strategy) => {
            const K = 15; // Game size
            const { guarantee, condition } = strategy;
            
            // 1. Generate all possible winning scenarios (Condition)
            const scenarios = getCombinations(selectedNumbers, condition);
            
            // 2. Generate all possible games the user *could* play from their selection
            const potentialGames = getCombinations(selectedNumbers, K);

            // 3. Greedy Selection
            const finalGames = [];
            let uncoveredScenarios = [...scenarios];

            while (uncoveredScenarios.length > 0) {
                let bestGame = null;
                let bestCoveredCount = -1;
                let bestCoveredIndices = [];

                // Try to find the single game that covers the most remaining scenarios
                for (let i = 0; i < potentialGames.length; i++) {
                    const game = potentialGames[i];
                    let currentCoveredIndices = [];
                    
                    // Check how many scenarios this game covers
                    for (let j = 0; j < uncoveredScenarios.length; j++) {
                        const scenario = uncoveredScenarios[j];
                        // Count matches between game and scenario
                        let matchCount = 0;
                        let p1 = 0, p2 = 0;
                        while(p1 < game.length && p2 < scenario.length) {
                            if (game[p1] === scenario[p2]) { matchCount++; p1++; p2++; }
                            else if (game[p1] < scenario[p2]) { p1++; }
                            else { p2++; }
                        }

                        if (matchCount >= guarantee) {
                            currentCoveredIndices.push(j);
                        }
                    }

                    if (currentCoveredIndices.length > bestCoveredCount) {
                        bestCoveredCount = currentCoveredIndices.length;
                        bestGame = game;
                        bestCoveredIndices = currentCoveredIndices;
                    }
                }

                if (bestGame) {
                    finalGames.push(bestGame);
                    // Remove covered scenarios (filter by index is tricky in loop, better to rebuild)
                    const newUncovered = [];
                    const coveredSet = new Set(bestCoveredIndices);
                    for(let k=0; k<uncoveredScenarios.length; k++){
                        if(!coveredSet.has(k)) newUncovered.push(uncoveredScenarios[k]);
                    }
                    uncoveredScenarios = newUncovered;
                    
                    // Optimization: remove used game from potential
                    const gameIdx = potentialGames.indexOf(bestGame);
                    if(gameIdx > -1) potentialGames.splice(gameIdx, 1);
                } else {
                    break; // Should not happen if parameters are valid
                }
            }
            return finalGames;
        };

        // --- APP LOGIC ---
        function App() {
            // Theme State
            const [theme, setTheme] = useState(() => {
                try { return localStorage.getItem('loto_theme') || 'dark'; } 
                catch(e) { return 'dark'; }
            });

            const toggleTheme = () => {
                const newTheme = theme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
                localStorage.setItem('loto_theme', newTheme);
            };

            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Dados Globais
            const [fullHistory, setFullHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem('loto_full_history_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            // Estado para Filtro Global
            const [scopeSize, setScopeSize] = useState('all'); 

            // Dados Computados baseados no Filtro
            const activeHistory = useMemo(() => {
                if (scopeSize === 'all') return fullHistory;
                const limit = parseInt(scopeSize);
                return fullHistory.slice(0, limit);
            }, [fullHistory, scopeSize]);

            const [isFileLoaded, setIsFileLoaded] = useState(fullHistory.length > 0);
            const [error, setError] = useState(null);
            
            // Generator State
            const [genFilters, setGenFilters] = useState({
                oddTarget: 8, 
                sumMin: 180,
                sumMax: 220,
                repeatsTarget: 9, 
                fixedNumbers: [],
                excludeNumbers: []
            });
            const [generatedGames, setGeneratedGames] = useState([]);
            const [savedGames, setSavedGames] = useState(() => {
                try {
                    const saved = localStorage.getItem('loto_saved_games');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            // Manual Analysis State
            const [manualSelection, setManualSelection] = useState([]);
            
            // Closure (Fechamento) State
            const [closureStrategy, setClosureStrategy] = useState(CLOSURE_STRATEGIES[0]);
            const [closureSelection, setClosureSelection] = useState([]);
            const [closureResult, setClosureResult] = useState(null);
            const [isGeneratingClosure, setIsGeneratingClosure] = useState(false);
            const [closureSimStats, setClosureSimStats] = useState(null);
            const [isSearchingProfit, setIsSearchingProfit] = useState(false); // NOVO ESTADO

            const fileInputRef = useRef(null);

            // --- PERSISTENCE ---
            useEffect(() => {
                if (fullHistory.length > 0) {
                    try {
                        localStorage.setItem('loto_full_history_v2', JSON.stringify(fullHistory));
                    } catch(e) { console.warn("Storage cheio"); }
                }
            }, [fullHistory]);

            useEffect(() => {
                localStorage.setItem('loto_saved_games', JSON.stringify(savedGames));
            }, [savedGames]);

            // --- FILE PARSING ---
            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                const isExcel = file.name.endsWith('.xlsx') || file.name.endsWith('.xls');

                const processData = (data) => {
                    if (data.length > 0) {
                        data.sort((a, b) => b.Concurso - a.Concurso);
                        setFullHistory(data);
                        setIsFileLoaded(true);
                        setError(null);
                        setActiveTab('dashboard');
                    } else {
                        setError("Nenhum dado válido encontrado.");
                    }
                };

                if (isExcel) {
                    reader.onload = (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, {type: 'array'});
                            let sheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('LOTOFÁCIL')) || workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet);
                            
                            const parsed = jsonData.map(row => {
                                const dezenas = [];
                                for (let i = 1; i <= 25; i++) {
                                    const val = row[`Bola${i}`] || row[`B${i}`] || row[`bola${i}`];
                                    if (val) dezenas.push(parseInt(val));
                                }
                                if (dezenas.length < 15) {
                                    Object.keys(row).forEach(k => {
                                        if (!isNaN(parseInt(k)) && typeof row[k] === 'number') dezenas.push(row[k]);
                                    });
                                }
                                return {
                                    Concurso: parseInt(row['Concurso'] || row['concurso']),
                                    Data: row['Data Sorteio'] || row['Data'] || row['data'],
                                    Dezenas: dezenas.slice(0, 15).sort((a,b) => a-b)
                                };
                            }).filter(d => d.Dezenas.length === 15 && !isNaN(d.Concurso));
                            
                            processData(parsed);
                        } catch (err) { setError("Erro Excel: " + err.message); }
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.onload = (e) => {
                        try {
                            const text = e.target.result;
                            const lines = text.split('\n');
                            const results = [];
                            for (let i = 1; i < lines.length; i++) {
                                const line = lines[i].trim();
                                if (!line) continue;
                                const cols = line.split(/[;,]/);
                                if (cols.length > 15) {
                                    const dezenas = [];
                                    for(let j=2; j<cols.length; j++) {
                                        const n = parseInt(cols[j]);
                                        if(!isNaN(n) && n <= 25) dezenas.push(n);
                                    }
                                    const validDezenas = dezenas.slice(0, 15).sort((a,b)=>a-b);
                                    if (validDezenas.length === 15) {
                                        results.push({
                                            Concurso: parseInt(cols[0]),
                                            Data: cols[1],
                                            Dezenas: validDezenas
                                        });
                                    }
                                }
                            }
                            processData(results);
                        } catch (err) { setError("Erro CSV: " + err.message); }
                    };
                    reader.readAsText(file);
                }
            };

            const resetData = () => {
                if(confirm("Deseja apagar todo o histórico e começar do zero?")){
                    setFullHistory([]);
                    setIsFileLoaded(false);
                    localStorage.removeItem('loto_full_history_v2');
                    window.location.reload();
                }
            };

            // --- STATISTICS ENGINE (MODIFICADO) ---
            const stats = useMemo(() => {
                if (!activeHistory.length) return null;

                const freqs = Array(25).fill(0);
                let totalSum = 0;
                let totalOdds = 0;
                
                activeHistory.forEach(draw => {
                    let drawSum = 0;
                    let drawOdds = 0;
                    draw.Dezenas.forEach(n => {
                        if (n >= 1 && n <= 25) freqs[n-1]++;
                        if (n % 2 !== 0) drawOdds++;
                        drawSum += n;
                    });
                    totalSum += drawSum;
                    totalOdds += drawOdds;
                });

                const totalDraws = activeHistory.length;
                
                const freqDetails = freqs.map((count, i) => ({
                    n: i + 1,
                    count,
                    percent: ((count / totalDraws) * 100).toFixed(1)
                }));

                const sortedFreq = [...freqDetails].sort((a, b) => b.count - a.count);

                // --- LÓGICA DE SEPARAÇÃO QUENTE/FRIO ---
                // Para evitar repetição, pegamos Top 8 como Quentes e Bottom 8 como Frios.
                // 8 Quentes + 8 Frios + 9 Neutros = 25.
                const topCount = 8;
                
                const hotNumbersList = sortedFreq.slice(0, topCount);
                const coldNumbersList = sortedFreq.slice(-topCount).reverse(); // Mais frios primeiro para visualização
                
                // Sets para busca rápida O(1) na renderização das bolas
                const hotSet = new Set(hotNumbersList.map(i => i.n));
                const coldSet = new Set(coldNumbersList.map(i => i.n));

                return {
                    totalDraws,
                    lastDraw: fullHistory[0], 
                    avgSum: Math.round(totalSum / totalDraws),
                    avgOdds: Math.round(totalOdds / totalDraws),
                    hotNumbersList, // Lista Top 8
                    coldNumbersList, // Lista Bottom 8
                    hotSet, // Set para verificação visual
                    coldSet, // Set para verificação visual
                    frequencies: freqDetails,
                    sortedFrequencies: sortedFreq
                };
            }, [activeHistory, fullHistory]);

            // --- GENERATOR LOGIC ---
            const generateGame = () => {
                const { oddTarget, sumMin, sumMax, repeatsTarget } = genFilters;
                const lastDrawSet = new Set(fullHistory[0]?.Dezenas || []);
                
                let attempts = 0;
                const maxAttempts = 10000; 
                
                while (attempts < maxAttempts) {
                    attempts++;
                    const allNums = Array.from({length: 25}, (_, i) => i + 1);
                    const shuffled = allNums.sort(() => 0.5 - Math.random());
                    const candidate = shuffled.slice(0, 15).sort((a,b) => a-b);

                    const sum = candidate.reduce((a, b) => a + b, 0);
                    if (sum < sumMin || sum > sumMax) continue;

                    const odds = candidate.filter(n => n % 2 !== 0).length;
                    if (Math.abs(odds - oddTarget) > 1 && oddTarget !== 0) continue; 

                    if (lastDrawSet.size > 0) {
                        const repeats = candidate.filter(n => lastDrawSet.has(n)).length;
                        if (Math.abs(repeats - repeatsTarget) > 1 && repeatsTarget !== 0) continue;
                    }

                    const newGame = {
                        id: Date.now(),
                        numbers: candidate,
                        meta: { sum, odds, repeats: candidate.filter(n => lastDrawSet.has(n)).length }
                    };
                    
                    setGeneratedGames(prev => [newGame, ...prev].slice(0, 50)); 
                    return;
                }
                alert("Não foi possível gerar com estes filtros restritos. Tente abrir mais as margens.");
            };

            // --- SIMULATOR LOGIC ---
            const checkPerformance = (numbers) => {
                if (!activeHistory.length) return { maxHits: 0, hitsDistribution: {} };
                
                let maxHits = 0;
                const hitsDist = { 11:0, 12:0, 13:0, 14:0, 15:0 };

                activeHistory.forEach(draw => {
                    const hits = numbers.filter(n => draw.Dezenas.includes(n)).length;
                    if (hits > maxHits) maxHits = hits;
                    if (hits >= 11) hitsDist[hits]++;
                });

                return { maxHits, hitsDist };
            };

            const toggleManualNumber = (n) => {
                if (manualSelection.includes(n)) {
                    setManualSelection(manualSelection.filter(x => x !== n));
                } else {
                    if (manualSelection.length >= 20) return alert("Máximo de 20 números para análise.");
                    setManualSelection([...manualSelection, n].sort((a,b) => a-b));
                }
            };

            const toggleClosureNumber = (n) => {
                if (closureSelection.includes(n)) {
                    setClosureSelection(closureSelection.filter(x => x !== n));
                } else {
                    if (closureSelection.length >= closureStrategy.numbers) return alert(`Limite de ${closureStrategy.numbers} números atingido para este fechamento.`);
                    setClosureSelection([...closureSelection, n].sort((a,b) => a-b));
                }
            };

            // --- NOVO: AUTO SEARCH PROFIT LOGIC ---
            const handleAutoFindProfit = async () => {
                if (!activeHistory || activeHistory.length === 0) {
                    alert("Carregue dados primeiro.");
                    return;
                }

                setIsSearchingProfit(true);
                setClosureResult(null); // Limpar resultados anteriores
                setClosureSimStats(null);

                // Pequeno delay para a UI renderizar o estado de "Buscando..."
                await new Promise(resolve => setTimeout(resolve, 50));

                const maxAttempts = 300; // Tenta 300 combinações aleatórias. Se não achar, para.
                let foundCombination = null;
                const gamePrice = 3.0;
                const prizeValues = { 11: 6, 12: 12, 13: 30, 14: 1500, 15: 1500000 };
                const numbersNeeded = closureStrategy.numbers;

                // Loop de busca
                for (let i = 0; i < maxAttempts; i++) {
                    // 1. Gera candidato aleatório do tamanho da estratégia
                    const allNums = Array.from({length: 25}, (_, i) => i + 1);
                    const candidate = allNums.sort(() => 0.5 - Math.random())
                                            .slice(0, numbersNeeded)
                                            .sort((a,b) => a-b);
                    
                    // 2. Gera Matriz de Fechamento (Heavy Calc)
                    // Nota: generateOptimizedClosure é "pesada", mas para 17/18 números é rápido o suficiente.
                    const games = generateOptimizedClosure(candidate, closureStrategy);
                    
                    // 3. Simula Finanças
                    let totalCost = games.length * gamePrice * activeHistory.length; // Custo * Concursos (Simulando jogar em TODOS)
                    let totalPrizes = 0;

                    // Otimização: Se o custo for absurdamente alto, nem calcula tudo (mas aqui o custo é fixo pela estratégia)
                    // Calculamos prêmios percorrendo o histórico
                    for (let d = 0; d < activeHistory.length; d++) {
                        const draw = activeHistory[d];
                        for (let g = 0; g < games.length; g++) {
                            const hits = games[g].filter(n => draw.Dezenas.includes(n)).length;
                            if (hits >= 11) totalPrizes += prizeValues[hits];
                        }
                    }

                    const profit = totalPrizes - totalCost;

                    // 4. Critério de Parada: Lucro Positivo
                    if (profit > 0) {
                        foundCombination = candidate;
                        break;
                    }

                    // A cada 10 iterações, libera a thread pro navegador não travar
                    if (i % 20 === 0) await new Promise(r => setTimeout(r, 0));
                }

                if (foundCombination) {
                    setClosureSelection(foundCombination);
                    // Aciona a geração normal para popular a tela com os dados encontrados
                    // Precisamos chamar a lógica, mas como o estado acabou de ser setado, vamos passar o argumento direto
                    executeClosureGeneration(foundCombination);
                } else {
                    alert(`Não encontrei lucro positivo em ${maxAttempts} tentativas aleatórias para o filtro atual de ${activeHistory.length} concursos. Tente diminuir a quantidade de jogos analisados (Filtro 'Analisar').`);
                    setIsSearchingProfit(false);
                }
            };

            // Função separada para ser chamada tanto pelo botão "Gerar" quanto pelo "Auto Search"
            const executeClosureGeneration = (selectionToUse) => {
                const selection = selectionToUse || closureSelection;
                
                if (selection.length !== closureStrategy.numbers) {
                    alert(`Selecione exatamente ${closureStrategy.numbers} números.`);
                    setIsSearchingProfit(false);
                    return;
                }
                
                setIsGeneratingClosure(true);
                
                setTimeout(() => {
                    const games = generateOptimizedClosure(selection, closureStrategy);
                    
                    let totalCost = 0;
                    let totalPrizes = 0;
                    let prizesBreakdown = { 11:0, 12:0, 13:0, 14:0, 15:0 };
                    const gamePrice = 3.0;
                    const prizeValues = { 11: 6, 12: 12, 13: 30, 14: 1500, 15: 1500000 };

                    activeHistory.forEach(draw => {
                        totalCost += (games.length * gamePrice);
                        games.forEach(game => {
                            const hits = game.filter(n => draw.Dezenas.includes(n)).length;
                            if (hits >= 11) {
                                prizesBreakdown[hits]++;
                                totalPrizes += prizeValues[hits];
                            }
                        });
                    });

                    setClosureSimStats({
                        totalCost,
                        totalPrizes,
                        profit: totalPrizes - totalCost,
                        prizesBreakdown,
                        roi: totalCost > 0 ? ((totalPrizes - totalCost) / totalCost) * 100 : 0
                    });

                    setClosureResult(games);
                    setIsGeneratingClosure(false);
                    setIsSearchingProfit(false);
                }, 100);
            };

            // Wrapper para o botão manual
            const handleGenerateClosure = () => executeClosureGeneration(closureSelection);

            const saveClosureGames = () => {
                if (!closureResult) return;
                const newGames = closureResult.map(nums => ({
                    id: Date.now() + Math.random(),
                    numbers: nums,
                    meta: { sum: nums.reduce((a,b)=>a+b,0), odds: nums.filter(n=>n%2!==0).length, repeats: 0, tag: "Fechamento" }
                }));
                setSavedGames([...savedGames, ...newGames]);
                alert(`${newGames.length} jogos salvos com sucesso!`);
            };


            // --- MANUAL ANALYSIS LOGIC ---
            const manualAnalysis = useMemo(() => {
                if (manualSelection.length < 15) return null;
                const datasetToUse = activeHistory; 
                
                const hitsFull = { 11:0, 12:0, 13:0, 14:0, 15:0 };
                let totalHitsSum = 0;

                datasetToUse.forEach(draw => {
                    const hits = manualSelection.filter(n => draw.Dezenas.includes(n)).length;
                    if (hits >= 11 && hits <= 15) hitsFull[hits]++;
                    totalHitsSum += hits;
                });

                const avgHits = (totalHitsSum / datasetToUse.length).toFixed(2);

                const individualStats = manualSelection.map(n => {
                    const count = activeHistory.filter(d => d.Dezenas.includes(n)).length;
                    return { n, count, percent: ((count / activeHistory.length)*100).toFixed(0) };
                });

                const awardsLog = datasetToUse.map(draw => {
                    const hits = manualSelection.filter(n => draw.Dezenas.includes(n)).length;
                    return { ...draw, hits };
                }).filter(d => d.hits >= 11).sort((a,b) => b.Concurso - a.Concurso);

                return { hitsFull, avgHits, individualStats, awardsLog };

            }, [manualSelection, activeHistory]); 


            // --- UI RENDERERS ---

            if (!isFileLoaded) {
                return (
                    <div className={theme}>
                        <div className="min-h-screen bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-white flex flex-col items-center justify-center p-4 transition-colors duration-300">
                            <div className="max-w-md w-full glass-panel p-8 rounded-2xl text-center">
                                <div className="bg-emerald-500/20 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-500/50 shadow-[0_0_30px_rgba(16,185,129,0.2)]">
                                    <Icon name="Upload" size={40} className="text-emerald-500" />
                                </div>
                                
                                <h1 className="text-3xl font-bold mb-2 bg-gradient-to-r from-emerald-500 to-teal-400 bg-clip-text text-transparent">LotoAnalítica Pro</h1>
                                <p className="text-slate-500 dark:text-gray-400 mb-8 text-sm leading-relaxed">
                                    Importe sua planilha da Lotofácil (.xlsx ou .csv) para desbloquear inteligência estatística avançada.
                                </p>

                                <input type="file" accept=".csv,.xlsx,.xls" onChange={handleFileUpload} ref={fileInputRef} className="hidden" />
                                
                                <button onClick={() => fileInputRef.current.click()} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30 group">
                                    <Icon name="FileSpreadsheet" className="group-hover:scale-110 transition-transform" />
                                    Carregar Planilha
                                </button>

                                {error && (
                                    <div className="mt-4 bg-red-100 dark:bg-red-900/30 border border-red-500/50 p-3 rounded text-sm text-red-600 dark:text-red-200 flex items-center gap-2 justify-center animate-pulse-once">
                                        <Icon name="AlertTriangle" size={16} /> {error}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={theme}>
                    <div className="min-h-screen pb-20 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">
                        {/* TOP BAR */}
                        <div className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm dark:shadow-xl transition-colors">
                            <div className="max-w-7xl mx-auto px-4 py-3">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-gradient-to-br from-emerald-500 to-teal-600 p-2 rounded-lg shadow-lg">
                                                <Icon name="Dice5" className="text-white" size={24} />
                                            </div>
                                            <div>
                                                <h1 className="font-bold text-xl text-slate-800 dark:text-white tracking-tight">LotoAnalítica <span className="text-emerald-500 font-light">Pro</span></h1>
                                                <p className="text-[10px] text-slate-400 dark:text-gray-400 uppercase tracking-widest">Sistema Offline Inteligente</p>
                                            </div>
                                        </div>
                                        <button onClick={toggleTheme} className="md:hidden p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-yellow-400">
                                            {theme === 'dark' ? <Icon name="Sun" size={18} /> : <Icon name="Moon" size={18} />}
                                        </button>
                                    </div>
                                    
                                    <div className="flex items-center gap-3">
                                        <button onClick={toggleTheme} className="hidden md:flex p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
                                            {theme === 'dark' ? <Icon name="Sun" size={18} /> : <Icon name="Moon" size={18} />}
                                        </button>

                                        <div className="flex items-center gap-3 bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                                            <div className="px-2 flex items-center gap-2 text-xs text-slate-500 dark:text-gray-400 uppercase font-bold tracking-wider">
                                                <Icon name="Filter" size={14} />
                                                <span className="hidden sm:inline">Analisar:</span>
                                            </div>
                                            <div className="flex bg-slate-100 dark:bg-slate-900 rounded-md p-1 gap-1">
                                                {[
                                                    {id: '10', label: '10'},
                                                    {id: '50', label: '50'},
                                                    {id: '100', label: '100'},
                                                    {id: 'all', label: 'TODOS'}
                                                ].map(opt => (
                                                    <button
                                                        key={opt.id}
                                                        onClick={() => setScopeSize(opt.id)}
                                                        className={`px-3 py-1 rounded text-xs font-bold transition-all ${
                                                            scopeSize === opt.id 
                                                            ? 'bg-emerald-500 text-white shadow' 
                                                            : 'text-slate-500 dark:text-gray-500 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700'
                                                        }`}
                                                    >
                                                        {opt.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* NAVIGATION TABS */}
                            <div className="flex justify-center border-t border-slate-200 dark:border-slate-800 mt-2 bg-white/50 dark:bg-slate-900/50 overflow-x-auto">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
                                    { id: 'closure', label: 'Fechamentos Inteligentes', icon: 'Grid' }, 
                                    { id: 'manual', label: 'Analisador Manual', icon: 'Edit3' },
                                    { id: 'generator', label: 'Gerador IA', icon: 'Cpu' },
                                    { id: 'saved', label: 'Jogos Salvos', icon: 'Save' },
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`
                                            flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-all whitespace-nowrap
                                            ${activeTab === tab.id 
                                                ? 'border-emerald-500 text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/5' 
                                                : 'border-transparent text-slate-500 dark:text-gray-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'}
                                        `}
                                    >
                                        <Icon name={tab.icon} size={16} />
                                        <span className="hidden sm:inline">{tab.label}</span>
                                    </button>
                                ))}
                                <button onClick={resetData} className="px-4 py-3 text-red-400/50 hover:text-red-500 ml-4 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-t transition-colors">
                                    <Icon name="XCircle" size={18} />
                                </button>
                            </div>

                                            </div>
                                        )}
                                    </div>

                                    {/* Results */}
                                    <div className="lg:col-span-2 space-y-6">
                                        {manualSelection.length < 15 ? (
                                            <div className="h-full flex flex-col items-center justify-center glass-panel p-10 rounded-xl text-center text-slate-400 dark:text-gray-500 border-2 border-dashed border-slate-300 dark:border-slate-700">
                                                <Icon name="Edit3" size={48} className="mb-4 opacity-50" />
                                                <p>Selecione pelo menos 15 números para ver a análise completa.</p>
                                            </div>
                                        ) : (
                                            <>
                                                {/* Prize History Card */}
                                                <div className="glass-panel p-6 rounded-xl">
                                                    <h3 className="text-slate-800 dark:text-white font-bold mb-4 flex items-center gap-2">
                                                        <Icon name="History" className="text-amber-500" />
                                                        Performance Histórica ({scopeSize === 'all' ? 'Todos os Concursos' : `Últimos ${scopeSize} Concursos`})
                                                    </h3>
                                                    <div className="grid grid-cols-3 md:grid-cols-5 gap-4">
                                                        {[11,12,13,14,15].map(pts => (
                                                            <div key={pts} className={`text-center p-3 rounded-lg border ${pts === 15 ? 'bg-emerald-100 dark:bg-emerald-900/30 border-emerald-500' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`}>
                                                                <div className={`text-xs font-bold uppercase mb-1 ${pts === 15 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500 dark:text-gray-400'}`}>
                                                                    {pts} Pontos
                                                                </div>
                                                                <div className="text-2xl font-bold text-slate-800 dark:text-white">
                                                                    {manualAnalysis.hitsFull[pts]}
                                                                </div>
                                                                <div className="text-[10px] text-slate-500 dark:text-gray-500">vezes</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Individual Stats Grid */}
                                                <div className="glass-panel p-6 rounded-xl">
                                                    <h3 className="text-slate-800 dark:text-white font-bold mb-4">Análise Individual no Período</h3>
                                                    <div className="grid grid-cols-3 md:grid-cols-5 gap-3">
                                                        {manualAnalysis.individualStats.map(stat => (
                                                            <div key={stat.n} className="bg-slate-50 dark:bg-slate-800 p-2 rounded border border-slate-200 dark:border-slate-700 flex flex-col items-center">
                                                                <span className={`font-bold text-lg ${stats.hotSet.has(stat.n) ? 'text-red-500' : stats.coldSet.has(stat.n) ? 'text-blue-500' : 'text-emerald-600 dark:text-emerald-400'}`}>{stat.n}</span>
                                                                <span className="text-xs text-slate-700 dark:text-white">{stat.count}x</span>
                                                                <div className="w-full bg-slate-200 dark:bg-slate-700 h-1 mt-1 rounded-full overflow-hidden">
                                                                    <div className={`${stats.hotSet.has(stat.n) ? 'bg-red-500' : stats.coldSet.has(stat.n) ? 'bg-blue-500' : 'bg-emerald-500'} h-full`} style={{width: `${stat.percent}%`}}></div>
                                                                </div>
                                                                <span className="text-[9px] text-slate-500 dark:text-gray-500">{stat.percent}% freq</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                                
                                                {/* Prizes Log */}
                                                <div className="glass-panel p-6 rounded-xl border-t-4 border-emerald-500 mt-6">
                                                    <h3 className="text-slate-800 dark:text-white font-bold mb-4 flex items-center gap-2">
                                                        <Icon name="Database" className="text-emerald-500" />
                                                        Concursos Premiados com esta Seleção ({manualAnalysis.awardsLog.length})
                                                    </h3>
                                                    
                                                    <div className="overflow-x-auto max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                                                        <table className="w-full text-sm text-left text-slate-500 dark:text-gray-400">
                                                            <thead className="text-xs text-slate-700 uppercase bg-slate-50 dark:bg-slate-700 dark:text-gray-400 sticky top-0 z-10">
                                                                <tr>
                                                                    <th className="px-4 py-3 rounded-tl-lg">Concurso</th>
                                                                    <th className="px-4 py-3">Data</th>
                                                                    <th className="px-4 py-3 text-center">Acertos</th>
                                                                    <th className="px-4 py-3 rounded-tr-lg">Dezenas Sorteads (Coincidentes)</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {manualAnalysis.awardsLog.map((log) => (
                                                                    <tr key={log.Concurso} className="bg-white border-b dark:bg-slate-800 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600">
                                                                        <td className="px-4 py-3 font-bold text-slate-900 dark:text-white">#{log.Concurso}</td>
                                                                        <td className="px-4 py-3">{log.Data}</td>
                                                                        <td className="px-4 py-3 text-center">
                                                                            <span className={`px-2 py-1 rounded text-xs font-bold 
                                                                                ${log.hits === 15 ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 
                                                                                  log.hits === 14 ? 'bg-amber-100 text-amber-800 border border-amber-300' : 
                                                                                  'bg-blue-100 text-blue-800 border border-blue-300'}`}>
                                                                                {log.hits} pts
                                                                            </span>
                                                                        </td>
                                                                        <td className="px-4 py-3">
                                                                            <div className="flex flex-wrap gap-1 max-w-md">
                                                                                {log.Dezenas.map(n => {
                                                                                    const isHit = manualSelection.includes(n);
                                                                                    return (
                                                                                        <span key={n} className={`w-5 h-5 flex items-center justify-center rounded-full text-[10px] font-bold 
                                                                                            ${isHit ? 'bg-emerald-500 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-400'}`}>
                                                                                            {n}
                                                                                        </span>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                                {manualAnalysis.awardsLog.length === 0 && (
                                                                    <tr>
                                                                        <td colSpan="4" className="px-6 py-8 text-center text-slate-500">
                                                                            Nenhum prêmio encontrado neste período histórico para a combinação selecionada.
                                                                        </td>
                                                                    </tr>
                                                                )}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* --- GENERATOR TAB --- */}
                            {activeTab === 'generator' && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="glass-panel p-6 rounded-xl h-fit">
                                        <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-6 flex items-center gap-2">
                                            <Icon name="Sliders" className="text-emerald-500" /> Configuração IA
                                        </h2>
                                        
                                        <div className="space-y-6">
                                            <div>
                                                <div className="flex justify-between text-xs text-slate-500 dark:text-gray-400 mb-2">
                                                    <span>Ímpares</span>
                                                    <span className="text-emerald-600 dark:text-emerald-400 font-bold">{genFilters.oddTarget}</span>
                                                </div>
                                                <input type="range" min="4" max="11" value={genFilters.oddTarget} onChange={e=>setGenFilters({...genFilters, oddTarget: parseInt(e.target.value)})} className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500"/>
                                            </div>

                                            <div>
                                                <div className="flex justify-between text-xs text-slate-500 dark:text-gray-400 mb-2">
                                                    <span>Repetidos do Anterior</span>
                                                    <span className="text-blue-600 dark:text-blue-400 font-bold">{genFilters.repeatsTarget}</span>
                                                </div>
                                                <input type="range" min="5" max="13" value={genFilters.repeatsTarget} onChange={e=>setGenFilters({...genFilters, repeatsTarget: parseInt(e.target.value)})} className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500"/>
                                            </div>

                                            <div>
                                                <span className="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Intervalo de Soma</span>
                                                <div className="flex gap-2">
                                                    <input type="number" className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded p-2 text-slate-800 dark:text-white text-center" value={genFilters.sumMin} onChange={e=>setGenFilters({...genFilters, sumMin: parseInt(e.target.value)})}/>
                                                    <input type="number" className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded p-2 text-slate-800 dark:text-white text-center" value={genFilters.sumMax} onChange={e=>setGenFilters({...genFilters, sumMax: parseInt(e.target.value)})}/>
                                                </div>
                                            </div>

                                            <button onClick={generateGame} className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:brightness-110 text-white font-bold rounded-lg shadow-lg flex items-center justify-center gap-2 transition-all">
                                                <Icon name="Wand2" size={18} /> Gerar Palpites
                                            </button>
                                        </div>
                                    </div>

                                    <div className="md:col-span-2 space-y-4">
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-slate-800 dark:text-white font-bold">Jogos Gerados</h2>
                                            <span className="text-xs text-slate-500 dark:text-gray-500">Performance testada em: {scopeSize === 'all' ? 'Toda História' : `Últimos ${scopeSize}`}</span>
                                        </div>
                                        
                                        <div className="space-y-3">
                                            {generatedGames.map((game, i) => {
                                                const perf = checkPerformance(game.numbers);
                                                return (
                                                    <div key={game.id} className="glass-panel p-4 rounded-xl border-l-4 border-emerald-500 flex flex-col md:flex-row gap-4 justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors">
                                                        <div className="flex-1">
                                                            <div className="flex gap-1 mb-2">
                                                                {game.numbers.map(n => (
                                                                    <MiniBall key={n} n={n} isHot={stats.hotSet.has(n)} isCold={stats.coldSet.has(n)} />
                                                                ))}
                                                            </div>
                                                            <div className="flex gap-3 text-[10px] text-slate-500 dark:text-gray-500 uppercase tracking-wider">
                                                                <span>Soma: {game.meta.sum}</span>
                                                                <span>Ímp: {game.meta.odds}</span>
                                                                <span>Rep: {game.meta.repeats}</span>
                                                            </div>
                                                        </div>
                                                        
                                                        <div className="flex items-center gap-4 border-l border-slate-200 dark:border-slate-700 pl-4">
                                                            <div className="text-right">
                                                                <div className="text-[10px] text-slate-500 dark:text-gray-400">Melhor Resultado (Período)</div>
                                                                <div className={`text-lg font-bold ${perf.maxHits >= 14 ? 'text-amber-500' : perf.maxHits >= 11 ? 'text-emerald-500' : 'text-slate-400 dark:text-gray-500'}`}>
                                                                    {perf.maxHits} Pontos
                                                                </div>
                                                            </div>
                                                            <button onClick={() => setSavedGames([...savedGames, game])} className="p-2 bg-emerald-100 dark:bg-emerald-500/10 hover:bg-emerald-500 text-emerald-600 dark:text-emerald-400 hover:text-white rounded-lg transition-colors">
                                                                <Icon name="BookmarkPlus" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {generatedGames.length === 0 && (
                                                <div className="text-center py-12 text-slate-500 dark:text-gray-500 bg-slate-100 dark:bg-slate-800/30 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl">
                                                    Aperte "Gerar Palpites" para usar a inteligência artificial.
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- SAVED TAB --- */}
                            {activeTab === 'saved' && (
                                <div>
                                    <h2 className="text-xl font-bold text-slate-800 dark:text-white mb-6">Jogos Salvos ({savedGames.length})</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {savedGames.map((game, i) => (
                                            <div key={i} className="glass-panel p-4 rounded-xl relative group">
                                                <button onClick={() => setSavedGames(savedGames.filter(g => g.id !== game.id))} className="absolute top-2 right-2 text-red-400 opacity-0 group-hover:opacity-100 p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded transition-all">
                                                    <Icon name="Trash2" size={16} />
                                                </button>
                                                <div className="flex justify-between items-center mb-2">
                                                    <div className="text-xs text-emerald-500 font-bold">JOGO {i+1}</div>
                                                    {game.meta.tag && <span className="text-[9px] bg-slate-100 dark:bg-slate-700 px-1 rounded text-slate-500">{game.meta.tag}</span>}
                                                </div>
                                                <div className="flex flex-wrap gap-1 mb-2">
                                                    {game.numbers.map(n => (
                                                        <MiniBall key={n} n={n} isHot={stats.hotSet.has(n)} isCold={stats.coldSet.has(n)} />
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
